;
; ECOBORA Smart Cooking HMI
; Trimmed from VIEWE's official esp-arduino-libs/ESP32_Display_Panel PlatformIO
; example — only the UEDX24320028E-WB-A env is kept. Re-add other [env:...]
; blocks from the original Ecobora.zip if you ever need a different VIEWE panel.
;

[platformio]
default_envs = BOARD_VIEWE_UEDX24320028E_WB_A

;
; Global config used by all board envs
;
[env]
framework = arduino
; The `espressif32` latest official release doesn't yet support Arduino v3.1.x,
; so this (VIEWE's own pin) is used instead — keep as-is unless you know why to change it.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
monitor_speed = 115200
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0

    ; LVGL is NOT pulled from the registry: v9.5.0 is bundled in lib/lvgl-9.5.0
    ; (with lib/lv_conf.h next to it). Don't add lvgl/lvgl here or you'll get two copies.
;
; Shared build flag groups
;
[common]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I lib
    -I Include

[spi_qspi_lcd]
build_flags =
    -DLV_COLOR_16_SWAP=1   ; required for this panel's SPI interface (GC9307).
                           ; Not an lv_conf option in v9 any more, but LVGL 9.5 still honours this
                           ; define and byte-swaps RGB565 right before flush_cb.

;
; UEDX24320028E-WB-A: 2.8" 240x320 SPI TFT (GC9307) + CHSC6540 capacitive touch
;
[env:BOARD_VIEWE_UEDX24320028E_WB_A]
build_flags =
    ${common.build_flags}
    ${spi_qspi_lcd.build_flags}
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX24320028E_WB_A
board = BOARD_VIEWE_UEDX24320028E_WB_A
